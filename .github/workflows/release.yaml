name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release LDC
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up D compiler (LDC)
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build project (Release mode)
        run: dub build --build=release --compiler=ldc2

      - name: Package binary
        run: |
          BINARY_NAME="convert"
          VERSION=${GITHUB_REF#refs/tags/}

          tar -czvf ${BINARY_NAME}-${VERSION}-linux-x86_64.tar.gz ${BINARY_NAME}

          echo "ARCHIVE_PATH=${BINARY_NAME}-${VERSION}-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
